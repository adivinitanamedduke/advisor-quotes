services:
  postgres:
    image: postgres:17-alpine
    container_name: advisor-quotes-postgres
    environment:
      POSTGRES_DB: advisor_quotes
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d advisor_quotes"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
